function toMins(t){ var p=t.split(':'); return parseInt(p[0])*60+parseInt(p[1]); }
function nowMins(){
  if(DEMO_PERIOD!=null){
    var ps=SCHEDULES.regular.periods||[];
    for(var i=0;i<ps.length;i++){ var mt=(ps[i].label||'').match(/\d+/);
      if(mt&&mt[0]===String(DEMO_PERIOD)) return (toMins(ps[i].start)+toMins(ps[i].end))>>1; }
  }
  var n=new Date(); return n.getHours()*60+n.getMinutes();
}
function dateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function schoolDaysThisWeek(date){
  var dow=date.getDay(), mon=new Date(date); mon.setDate(date.getDate()-(dow===0?6:dow-1)); var count=0;
  for(var i=0;i<5;i++){ var d=new Date(mon); d.setDate(mon.getDate()+i); if(!NO_SCHOOL.includes(dateStr(d))) count++; }
  return count;
}
async function loadOverrides(){
  var rows=await sbFetch('cw2_schedule_override','or=(room.eq.'+ROOM+',room.eq.global)&select=*');
  var map={}; (rows||[]).forEach(function(r){ map[r.room+'|'+r.date]=r; }); window._cwOverrides=map; return map;
}
function getSchedule(){
  if(DEMO_PERIOD!=null) return SCHEDULES.regular;
  var now=new Date(), ds=dateStr(now), dow=now.getDay();
  if(dow===0||dow===6||NO_SCHOOL.includes(ds)) return null;
  var ovr=window._cwOverrides||{}; var hit=ovr[ROOM+'|'+ds]||ovr['global|'+ds];
  if(hit){ if(hit.custom_periods) return {periods:hit.custom_periods}; if(hit.schedule_type&&SCHEDULES[hit.schedule_type]) return SCHEDULES[hit.schedule_type]; }
  if(DATE_OVERRIDES[ds]) return SCHEDULES[DATE_OVERRIDES[ds]];
  if(schoolDaysThisWeek(now)<=4) return SCHEDULES.regular;
  if(dow===1) return SCHEDULES.earlyRelease;
  if(dow===3) return SCHEDULES.blockWed;
  if(dow===4) return SCHEDULES.blockThu;
  return SCHEDULES.regular;
}
function scheduleLabel(){
  if(DEMO_PERIOD!=null) return 'REGULAR DAY';
  var now=new Date(), ds=dateStr(now), dow=now.getDay();
  if(dow===0||dow===6||NO_SCHOOL.includes(ds)) return 'NO SCHOOL';
  var ovr=window._cwOverrides||{}; var hit=ovr[ROOM+'|'+ds]||ovr['global|'+ds];
  if(hit&&hit.custom_label) return hit.custom_label.toUpperCase();
  var sched=getSchedule();
  for(var k in SCHEDULES){ if(SCHEDULES[k]===sched){
    return {regular:'REGULAR DAY',blockWed:'BLOCK DAY',blockThu:'BLOCK DAY',minimum:'MINIMUM DAY',earlyRelease:'EARLY RELEASE',foggy:'LATE ARRIVAL',activity:'ACTIVITY DAY',codeDay:'CODE DAY'}[k]||'REGULAR DAY';
  }}
  return 'REGULAR DAY';
}

  var now=new Date().toISOString();
  var rows=await sbFetch('cw2_messages','room=eq.'+ROOM+'&active=eq.true&expires_at=gte.'+now+'&select=*');
  CW_MESSAGES=rows||[];
}

function renderClock(){
  var n=new Date(), h=n.getHours(), m=String(n.getMinutes()).padStart(2,'0'), ap=h>=12?'PM':'AM';
  h=h%12||12;
  document.getElementById('tbClock').textContent = h+':'+m+' '+ap;
  document.getElementById('bigClock').textContent = h+':'+m;
}

function renderStatus(){
  document.getElementById('scheduleBadge').textContent = scheduleLabel();
  var sched = getSchedule();
  var box = document.getElementById('statusLabel');
  var main = document.getElementById('statusMain');
  var time = document.getElementById('statusTime');
  var bars = document.getElementById('status-bars');
  var n = nowMins();
  if(!sched){
    box.textContent = 'NO SCHOOL'; main.textContent = 'ENJOY YOUR DAY'; time.textContent = '--:--';
    bars.innerHTML = '';
    return;
  }
  var periods = sched.periods;
  var cur = null, next = null;
  for(var i=0;i<periods.length;i++){
    var p = periods[i];
    if(n >= toMins(p.start) && n < toMins(p.end)){ cur = p; next = periods[i+1]; break; }
    if(n < toMins(p.start)){ next = p; break; }
  }
  var barsHtml = '';
  for(var b=0;b<12;b++){ barsHtml += '<i style="height:'+(14+((b*37)%28))+'px"></i>'; }
  bars.innerHTML = barsHtml;
  if(cur){
    var left = toMins(cur.end) - n;
    box.textContent = (cur.label||'').toUpperCase() + (next ? (' → ' + (next.label||'').toUpperCase()) : '');
    main.textContent = (cur.break ? 'ON BREAK' : 'IN SESSION') ;
    time.textContent = left + ' MIN LEFT';
  } else if(next){
    var until = toMins(next.start) - n;
    box.textContent = 'PASSING PERIOD';
    main.textContent = 'NEXT: ' + (next.label||'').toUpperCase();
    time.textContent = until + ' MIN';
  } else {
    box.textContent = 'SCHOOL DAY OVER';
    main.textContent = 'SEE YOU TOMORROW';
    time.textContent = '--:--';
  }
}

function renderWeatherCard(){
  var temp = document.getElementById('wx-temp');
  var cond = document.getElementById('wx-cond');
  if(!CW_WEATHER){ temp.textContent='--°'; cond.textContent='--'; return; }
  temp.textContent = Math.round(CW_WEATHER.temperature_2m)+'°';
  cond.textContent = WEATHER_CODES[CW_WEATHER.weather_code] || '--';
}

function renderBirthdays(){
  var wrap = document.getElementById('bday-list');
  var upcoming = CW_BIRTHDAYS.map(function(b){
    return { name:b.name, days: bdaysUntil(b.month, b.day) };
  }).sort(function(a,b){ return a.days - b.days; }).slice(0,6);
  if(!upcoming.length){ wrap.innerHTML = '<div class="row"><span>No birthdays on file</span></div>'; return; }
  wrap.innerHTML = upcoming.map(function(u){
    var label = u.days===0 ? 'TODAY' : (u.days===1 ? '1 DAY' : u.days+' DAYS');
    return '<div class="row"><span>'+u.name+'</span><span>'+label+'</span></div>';
  }).join('');
}

function renderAnnounce(){
  var el = document.getElementById('announce');
  if(!CW_MESSAGES.length){ el.style.display='none'; return; }
  var m = CW_MESSAGES[0];
  var txt = [m.line1,m.line2,m.line3].filter(Boolean).join(' ');
  document.getElementById('announce-text').textContent = txt;
  el.style.display = 'block';
}

async function renderHonorRoll(){
  var names = await loadHonorRollNames();
  var wrap = document.getElementById('honor');
  if(!names.length){ wrap.style.display='none'; return; }
  wrap.style.display = 'block';
  var html = names.map(function(n){ return '<span>'+n+'</span><span class="hn-sep">★</span>'; }).join('');
  document.getElementById('honor-inner').innerHTML = html+html;
}

async function tickFast(){
  renderClock();
  renderStatus();
}
async function tickSlow(){
  await Promise.all([loadOverrides(), loadWeather(), loadMessages(), loadBirthdays(), loadNoMedia()]);
  renderWeatherCard();
  renderBirthdays();
  renderAnnounce();
  renderHonorRoll();
}
async function init(){
  await loadRoomConfig();
  await tickSlow();
  tickFast();
  setInterval(tickFast, 1000);
  setInterval(tickSlow, 5*60*1000);
}
init();

</script>

<script id="cw2-sports-widget-js">
(function(){
  var SPORTS_SHEET_CSV='https://docs.google.com/spreadsheets/d/1gjKQn9tDGOcyiuWn9feyrt1Xw5_8T3_qq9wcjdWvrh0/export?format=csv';
  var CW_SPORTS_DAYS=[];

  function mountSportsEl(){
    if(document.getElementById('sports')) return;
    var html='<div id="sports"><div id="sports-label">Sports Today</div>'+
      '<div id="sports-track"><div id="sports-inner"></div></div></div>';
    var wrap=document.createElement('div');
    wrap.innerHTML=html;
    var el=wrap.firstElementChild;
    var announce=document.getElementById('announce');
    var honor=document.getElementById('honor');
    if(announce&&announce.parentNode){ announce.parentNode.insertBefore(el, announce.nextSibling); }
    else if(honor&&honor.parentNode){ honor.parentNode.insertBefore(el, honor); }
  }

  function parseCSV(text){
    var rows=[],row=[],field='',inQ=false;
    for(var i=0;i<text.length;i++){
      var c=text[i];
      if(inQ){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=c; }
      else{
        if(c==='"') inQ=true;
        else if(c===','){row.push(field);field='';}
        else if(c==='\r'){}
        else if(c==='\n'){row.push(field);rows.push(row);row=[];field='';}
        else field+=c;
      }
    }
    if(field.length||row.length){row.push(field);rows.push(row);}
    return rows;
  }
  function dateISO(s){
    var m=(s||'').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
    if(!m) return null;
    var yy=+m[3]; if(yy<100) yy+=2000;
    var mm=String(+m[1]); if(mm.length<2) mm='0'+mm;
    var dd=String(+m[2]); if(dd.length<2) dd='0'+dd;
    return yy+'-'+mm+'-'+dd;
  }
  function stripEmoji(s){
    s=(s||'').trim();
    var m=s.match(/^([\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\uFE0F\u200D]+)\s*(.*)$/u);
    if(m) return {emoji:m[1].replace(/\uFE0F/g,'').trim(), text:m[2].trim()};
    return {emoji:'', text:s};
  }
  function entryLine(e){
    var parts=[];
    parts.push((e.emoji?e.emoji+' ':'')+(e.sport||'Game')+(e.level?' ('+e.level+')':''));
    if(e.opponent) parts.push((e.home?'vs ':'@ ')+e.opponent);
    else if(e.place) parts.push((e.home?'vs ':'@ ')+e.place);
    if(e.time) parts.push(e.time);
    if(e.release) parts.push('Release '+e.release);
    return parts.join(' · ');
  }
  function todayISO(){
    var d=new Date();
    var mm=String(d.getMonth()+1); if(mm.length<2)mm='0'+mm;
    var dd=String(d.getDate()); if(dd.length<2)dd='0'+dd;
    return d.getFullYear()+'-'+mm+'-'+dd;
  }

  async function loadSportsSchedule(){
    try{
      var res=await fetch(SPORTS_SHEET_CSV);
      if(!res.ok){CW_SPORTS_DAYS=[];return;}
      var rows=parseCSV(await res.text());
      var hIdx=-1;
      for(var i=0;i<rows.length;i++){ if(rows[i][0]==='Date'&&rows[i].indexOf('Sport')>=0){hIdx=i;break;} }
      if(hIdx<0){CW_SPORTS_DAYS=[];return;}
      var hd=rows[hIdx].map(function(h){return (h||'').trim();});
      var col=function(n){return hd.indexOf(n);};
      var cD=col('Date'),cDay=col('Day'),cSp=col('Sport'),cLv=col('Level'),cGe=col('Gender'),
          cPl=col('Place'),cTm=col('Time'),cOp=col('Opponent'),cFa=col('Facility'),cRl=col('Dismiss/Release Time');
      var groups=[],curDate=null,curDay=null;
      for(var r=hIdx+1;r<rows.length;r++){
        var row=rows[r]||[];
        var blank=true;
        for(var k=0;k<row.length;k++){ if(row[k]&&String(row[k]).trim()){blank=false;break;} }
        if(blank) continue;
        var dr=(row[cD]||'').trim();
        var iso=dr?dateISO(dr):null;
        if(iso){curDate=iso;curDay=(row[cDay]||'').trim();}
        if(!curDate) continue;
        var spRaw=(row[cSp]||'').trim();
        if(!spRaw) continue;
        var sp=stripEmoji(spRaw), pl=stripEmoji((row[cPl]||'').trim());
        var isHome=pl.emoji.indexOf('🏠')>=0||/^home/i.test(pl.text);
        var entry={sport:sp.text,emoji:sp.emoji,level:(row[cLv]||'').trim(),gender:(row[cGe]||'').trim(),
          home:isHome,place:pl.text,time:(row[cTm]||'').trim(),opponent:(row[cOp]||'').trim(),
          facility:(row[cFa]||'').trim(),release:(row[cRl]||'').trim()};
        var g=groups.length&&groups[groups.length-1].date===curDate?groups[groups.length-1]:null;
        if(!g){g={date:curDate,day:curDay,entries:[]};groups.push(g);}
        g.entries.push(entry);
      }
      CW_SPORTS_DAYS=groups;
    }catch(e){CW_SPORTS_DAYS=[];}
  }

  function renderSports(){
    var wrap=document.getElementById('sports');
    if(!wrap) return;
    if(!CW_SPORTS_DAYS.length){wrap.style.display='none';return;}
    var t=todayISO();
    var group=null;
    for(var i=0;i<CW_SPORTS_DAYS.length;i++){ if(CW_SPORTS_DAYS[i].date===t){group=CW_SPORTS_DAYS[i];break;} }
    var label='SPORTS TODAY';
    if(!group){
      var future=CW_SPORTS_DAYS.filter(function(g){return g.date>t;}).sort(function(a,b){return a.date<b.date?-1:1;});
      group=future[0];
      if(group){
        var dt=new Date(group.date+'T00:00:00');
        label='NEXT UP · '+dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
      }
    }
    if(!group){wrap.style.display='none';return;}
    var html=group.entries.map(function(e){return '<span class="sp-item">'+entryLine(e)+'</span><span class="sp-sep">·</span>';}).join('');
    document.getElementById('sports-label').textContent=label;
    document.getElementById('sports-inner').innerHTML=html+html;
    wrap.style.display='flex';
  }

  async function tick(){ await loadSportsSchedule(); renderSports(); }
  mountSportsEl();
  tick();
  setInterval(tick, 5*60*1000);
})();
</script>
